# Heap sized for the KSP2 + Compose toolchain on a 4 GB build host. The
# compiler runs in-process (single JVM) to avoid gradle-daemon and
# kotlin-daemon double allocation.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
