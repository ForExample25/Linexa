                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config && gcc --version | head -1"
                  - id: build-essential-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y build-essential pkg-config"
              - id: cmake
                type: application
                name: CMake
                children:
                  - id: cmake-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y cmake && cmake --version | head -1"
                  - id: cmake-remove
                    type: action
                    name: Uninstall
