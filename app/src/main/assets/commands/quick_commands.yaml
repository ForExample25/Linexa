    # ──────────────────────────────────────────────────────────────────────
    # alpine — apk
    # ──────────────────────────────────────────────────────────────────────
    alpine:
      default:
        categories:
          - id: system
            type: category
            name: System
            description: Package database and system information operations.
            children:
              - id: update-system
                type: action
                name: Check for updates and upgrade
                description: Refreshes the package index and upgrades installed packages.
                action: update
                icon: refresh
                command: "apk update && apk upgrade"
              - id: clean-package-cache
                type: action
                name: Clean package manager cache
                description: Removes downloaded packages from the apk cache.
                icon: delete
                command: "apk cache clean 2>/dev/null || rm -rf /var/cache/apk/*"
              - id: system-info
                type: action
                name: View system info
                description: CPU and memory overview, plus the Android host feed when available.
                action: check
                icon: info
                command: "echo '--- CPU ---'; lscpu 2>/dev/null || head -12 /proc/cpuinfo; echo '--- MEMORY ---'; free -h 2>/dev/null || head -12 /proc/meminfo; echo '--- LINEXA FEED ---'; linexa-hostinfo 2>/dev/null || echo 'linexa-hostinfo feed not available'"
              - id: disk-usage
                type: action
                name: Disk usage
                description: Filesystem usage of the workspace.
                action: check
                icon: storage
                command: "df -h"
              - id: clear-screen
                type: action
                name: Clear screen
                description: Clears the terminal display.
                command: "clear"

