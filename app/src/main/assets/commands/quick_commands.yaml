    # ──────────────────────────────────────────────────────────────────────
    # arch — pacman
    # ──────────────────────────────────────────────────────────────────────
    arch:
      default:
        categories:
          - id: system
            type: category
            name: System
            description: Package database and system information operations.
            children:
              - id: update-system
                type: action
                name: Check for updates and upgrade
                description: Synchronizes the package database and upgrades everything (no confirmation prompt).
                action: update
                icon: refresh
                command: "pacman -Syu --noconfirm"
              - id: clean-package-cache
                type: action
                name: Clean package manager cache
                description: Removes all cached packages not currently installed.
                icon: delete
                command: "pacman -Sc --noconfirm"
              - id: remove-orphans
                type: action
                name: Remove orphaned packages
                description: Removes packages installed as dependencies that nothing requires any more.
                icon: delete
                command: "if [ -n \"$(pacman -Qdtq)\" ]; then pacman -Rns --noconfirm $(pacman -Qdtq); else echo 'no orphaned packages'; fi"
              - id: system-info
                type: action
                name: View system info
                description: CPU and memory overview, plus the Android host feed when available.
                action: check
                icon: info
                command: "echo '--- CPU ---'; lscpu | head -12; echo '--- MEMORY ---'; free -h; echo '--- LINEXA FEED ---'; linexa-hostinfo 2>/dev/null || echo 'linexa-hostinfo feed not available'"
              - id: disk-usage
                type: action
                name: Disk usage
                description: Filesystem usage of the workspace.
                action: check
                icon: storage
                command: "df -h"
              - id: clear-screen
                type: action
                name: Clear screen
                description: Clears the terminal display.
                command: "clear"

          - id: software-management
            type: category
