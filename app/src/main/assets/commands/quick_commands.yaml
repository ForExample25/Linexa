      # Debian 13 (trixie) ships fastfetch; the system-info entry upgrades to it.
      versions:
        "13":
          patches:
            - id: system-info
              description: System overview via fastfetch, with the classic CPU/memory fallback.
              command: "command -v fastfetch >/dev/null 2>&1 && fastfetch || (echo '--- CPU ---'; lscpu | head -12; echo '--- MEMORY ---'; free -h)"

    # ──────────────────────────────────────────────────────────────────────
    # ubuntu — Ubuntu's own selections; snap-only packages (Chromium,
    # Firefox on jammy) are deliberately absent because snapd cannot run
    # under proot.
    # ──────────────────────────────────────────────────────────────────────
    ubuntu:
      default:
        categories:
          - id: system
            type: category
            name: System
            description: Package database and system information operations.
            children:
              - id: update-upgrade
                type: action
                name: Check for updates and upgrade
                description: apt-get update, then upgrade with noninteractive conffile handling.
                action: update
                icon: refresh
                command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" upgrade"
              - id: full-upgrade
                type: action
                name: Full upgrade (dist-upgrade)
                description: Also removes or replaces packages when required to complete the upgrade.
                action: update
                icon: refresh
                command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" full-upgrade"
              - id: clean-package-cache
                type: action
                name: Clean package manager cache
                description: Removes downloaded .deb archives and stale package lists.
                icon: delete
                command: "apt-get clean && rm -rf /var/lib/apt/lists/*"
              - id: autoremove
                type: action
                name: Autoremove unused packages
                description: Removes packages that were auto-installed as dependencies and are no longer needed.
                icon: delete
                command: "apt-get autoremove --purge -y"
              - id: fix-dpkg
                type: action
                name: Fix interrupted packages (dpkg)
                description: Configures any packages left half-installed by an interrupted operation.
                action: check
                icon: settings
                command: "dpkg --configure -a"
              - id: system-info
                type: action
                name: View system info
                description: CPU and memory overview, plus the Android host feed when available.
                action: check
                icon: info
                command: "echo '--- CPU ---'; lscpu | head -12; echo '--- MEMORY ---'; free -h; echo '--- LINEXA FEED ---'; linexa-hostinfo 2>/dev/null || echo 'linexa-hostinfo feed not available'"
              - id: disk-usage
                type: action
                name: Disk usage
                description: Filesystem usage of the workspace.
                action: check
                icon: storage
                command: "df -h"
              - id: clear-screen
                type: action
                name: Clear screen
                description: Clears the terminal display.
                command: "clear"

          - id: software-management
            type: category
            name: Software Management
            description: Install or remove desktop applications and developer tools from Ubuntu's archive.
            children:
              - id: libreoffice
                type: application
                name: LibreOffice
                description: The full LibreOffice suite from Ubuntu's archive (large download).
                children:
                  - id: libreoffice-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libreoffice"
                  - id: libreoffice-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y libreoffice*"
              - id: gimp
                type: application
                name: GIMP
                description: GNU Image Manipulation Program.
                children:
                  - id: gimp-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gimp"
                  - id: gimp-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y gimp"
              - id: krita
                type: application
                name: Krita
                description: Digital painting application (disable GPU acceleration for smoother operation under proot).
                children:
                  - id: krita-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y krita krita-l10n"
                  - id: krita-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y krita krita-l10n"
              - id: octave
                type: application
                name: Octave
                description: Scientific computing environment, a Matlab alternative to a useful extent.
                children:
                  - id: octave-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y octave"
                  - id: octave-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y octave"
              - id: visual-studio-code
                type: application
                name: Visual Studio Code
                description: Installed from Microsoft's arm64 .deb; adds a "Code (no sandbox)" launcher because Electron's sandbox needs user namespaces Android withholds under proot.
                children:
                  - id: vscode-install
                    type: action
                    name: Install
                    action: install
                    command: "wget -O /tmp/vscode.deb 'https://aka.ms/linux-arm64-deb' && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/vscode.deb && cp /usr/share/applications/code.desktop /usr/share/applications/code-no-sandbox.desktop && sed -i 's/^Name=.*/Name=Code (no sandbox)/' /usr/share/applications/code-no-sandbox.desktop && sed -i 's#Exec=/usr/share/code/code %F#Exec=/usr/share/code/code --no-sandbox %F#g' /usr/share/applications/code-no-sandbox.desktop; rm -f /tmp/vscode.deb"
                  - id: vscode-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y code && rm -f /usr/share/applications/code-no-sandbox.desktop"
              - id: vlc
                type: application
                name: VLC media player
                description: Multimedia player from Ubuntu's archive.
                children:
                  - id: vlc-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y vlc"
                  - id: vlc-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y vlc"
              - id: thunderbird
                type: application
                name: Thunderbird
                description: Mail and calendar client from Ubuntu's archive.
                children:
                  - id: thunderbird-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y thunderbird"
                  - id: thunderbird-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y thunderbird"

          - id: browsers
            type: category
            name: Browsers
            description: Web browsers that actually run here — jammy's own firefox/chromium are snap-stubs.
            children:
              - id: firefox-esr
                type: application
                name: Firefox ESR
                description: Firefox ESR from the Mozilla team PPA (jammy's own firefox package is a snap-stub that cannot run here). Adds the PPA, pins it, installs.
                children:
                  - id: firefox-esr-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common && add-apt-repository -y ppa:mozillateam/ppa && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y -t 'o=LP-PPA-mozillateam' firefox-esr"
                  - id: firefox-esr-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y firefox-esr"

          - id: development
            type: category
            name: Development
            description: Compilers, build systems and language toolchains from Ubuntu's archive.
            children:
              - id: build-essential
