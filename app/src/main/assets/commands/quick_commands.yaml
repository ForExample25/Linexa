# ══════════════════════════════════════════════════════════════════════════
# Linexa built-in Quick Commands catalog — THE ONE CANONICAL SOURCE
# ══════════════════════════════════════════════════════════════════════════
#
# WHAT THIS FILE IS
#
# The app's single project-owned catalog of built-in Workspace Quick
# Commands. It is parsed by QuickCommandsCatalogParser, validated by
# QuickCommandsCatalogValidator, memoized by QuickCommandsCatalogLoader and
# resolved per workspace by QuickCommandsResolver. The Commands screen has no
# other built-in source: the old hard-coded Kotlin fallback list
# (WorkspaceContent.builtinShortcuts) and the legacy `.tiny.yaml`
# `quick_commands` flattener were both replaced by this file.
#
# This file is DATA, never code. It is also the only place the extracted
# quick-command content of the reference TinyContainer `.tiny.yaml` lives:
# that tree was normalized (every node typed, every action explicit) into the
# schema below. `.tiny.yaml` files inside imported images are NOT read for
# commands anymore — nothing in the app depends on them for Quick Commands.
#
# SCHEMA (v1)
#
#   linexa_quick_commands:
#     schema_version: 1
#     distributions:
#       <key>:                      # common | ubuntu | debian | fedora | arch | alpine
#         default:
#           categories: [ node... ]
#         versions:
#           "<selector>":           # quoted! ("22.04" is a string, not a float)
#             patches:              # optional — field overrides applied by node id
#               - id: <existing node id>
#                 name? description? command?
#             categories: [ node... ]   # optional — appended after the defaults
#
# NODE FIELDS (every node states what it is explicitly — nothing is inferred)
#
#   id          required, unique within its branch, safe token [a-z0-9._-]
#   type        required, one of: category | group | application | action
#                 category     top navigational level (System, Browsers…)
#                 group        nested navigational level (JetBrains IDEs…)
#                 application  a software item whose children are its actions
#                 action       an executable leaf — the only type with a command
#   name        required, user-facing title
#   description optional, user-facing explanation
#   children    required for category/group/application; forbidden on action
#   command     required for action; forbidden elsewhere
#   action      optional tag on action: install|remove|update|launch|check
#   as_root     optional on action: run in the root-emulated terminal
#   icon        optional icon key (see WorkspaceShortcuts ICONS table)
#
# VERSION RESOLUTION (QuickCommandsResolver)
#
#   1. an exact version-selector match wins;
#   2. otherwise the longest matching dot-component prefix wins
#      ("22.04.5" → "22.04" → "22");
#   3. otherwise the distribution default applies;
#   4. a workspace whose distribution is unknown gets ONLY the `common`
#      branch — never another distribution's commands.
#
# The `common` branch is included for EVERY distribution (after the distro's
# own categories) and holds genuinely portable commands only.
#
# COMMANDS POLICY
#
# Every command runs inside the guest through the existing exec/terminal
# bridge, on a user tap. Commands are per-distribution and honest:
# apt-get for Debian/Ubuntu, dnf for Fedora, pacman for Arch, apk for Alpine.
# A package that does not exist in a distribution's archive is never offered
# for that distribution. Package entries declare BOTH directions where the
# archive supports them.
# ══════════════════════════════════════════════════════════════════════════

linexa_quick_commands:
  schema_version: 1

  distributions:

    # ──────────────────────────────────────────────────────────────────────
    # common — portable commands, resolved for EVERY workspace
    # ──────────────────────────────────────────────────────────────────────
    common:
      default:
        categories:
          - id: general-system
            type: category
            name: System Tools
            description: Portable diagnostics that work on every distribution.
            children:
              - id: update-system
                type: action
                name: Update System
                description: Updates packages via whichever package manager the guest actually ships.
                action: update
                icon: refresh
                command: "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get upgrade -y; elif command -v apk >/dev/null 2>&1; then apk update && apk upgrade; elif command -v pacman >/dev/null 2>&1; then pacman -Syu --noconfirm; elif command -v dnf >/dev/null 2>&1; then dnf upgrade -y; elif command -v zypper >/dev/null 2>&1; then zypper --non-interactive update -y; else echo 'no supported package manager found'; fi"
              - id: system-info
                type: action
                name: System Info
                description: Hardware and OS overview.
                action: check
                icon: info
                command: "command -v fastfetch >/dev/null 2>&1 && fastfetch || (echo 'fastfetch is not installed — OS release:'; cat /etc/os-release)"
              - id: hardware-info
                type: action
                name: Hardware Info
                description: CPU cores, clocks and memory from the Android host.
                action: check
                icon: cpu
                command: "(lscpu 2>/dev/null || head -25 /proc/cpuinfo); echo '---'; free -h 2>/dev/null || head -12 /proc/meminfo; echo '---'; linexa-hostinfo 2>/dev/null || echo '(host feed unavailable)'"
              - id: disk-usage
                type: action
                name: Disk Usage
                description: Free space per mount.
                action: check
                icon: storage
                command: "df -h --exclude-type=tmpfs --exclude-type=devtmpfs 2>/dev/null || df -h"
              - id: memory-usage
                type: action
                name: Memory
                description: RAM and swap usage.
                action: check
                icon: memory
                command: "free -h 2>/dev/null || head -12 /proc/meminfo"
              - id: network-info
                type: action
                name: Network Info
                description: Interfaces and current IP addresses.
                action: check
                icon: network
                command: "ip -brief address show 2>/dev/null || hostname -I"
              - id: clear-screen
                type: action
                name: Clear Screen
                description: Clears the terminal display.
                command: "clear"

    # ──────────────────────────────────────────────────────────────────────
    # debian
    # ──────────────────────────────────────────────────────────────────────
    debian:
      default:
        categories:
          - id: system
            type: category
            name: System
            description: Package database and system information operations.
            children:
              - id: update-upgrade
                type: action
                name: Check for updates and upgrade
                description: apt-get update, then upgrade with noninteractive conffile handling.
                action: update
                icon: refresh
                command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" upgrade"
              - id: full-upgrade
                type: action
                name: Full upgrade (dist-upgrade)
                description: Also removes or replaces packages when required to complete the upgrade.
                action: update
                icon: refresh
                command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" full-upgrade"
              - id: clean-package-cache
                type: action
                name: Clean package manager cache
                description: Removes downloaded .deb archives and stale package lists.
                icon: delete
                command: "apt-get clean && rm -rf /var/lib/apt/lists/*"
              - id: autoremove
                type: action
                name: Autoremove unused packages
                description: Removes packages that were auto-installed as dependencies and are no longer needed.
                icon: delete
                command: "apt-get autoremove --purge -y"
              - id: fix-dpkg
                type: action
                name: Fix interrupted packages (dpkg)
                description: Configures any packages left half-installed by an interrupted operation.
                action: check
                icon: settings
                command: "dpkg --configure -a"
              - id: system-info
                type: action
                name: View system info
                description: CPU and memory overview, plus the Android host feed when available.
                action: check
                icon: info
                command: "echo '--- CPU ---'; lscpu | head -12; echo '--- MEMORY ---'; free -h; echo '--- LINEXA FEED ---'; linexa-hostinfo 2>/dev/null || echo 'linexa-hostinfo feed not available'"
              - id: disk-usage
                type: action
                name: Disk usage
                description: Filesystem usage of the workspace.
                action: check
                icon: storage
                command: "df -h"
              - id: clear-screen
                type: action
                name: Clear screen
                description: Clears the terminal display.
                command: "clear"

          - id: software-management
            type: category
            name: Software Management
            description: Install or remove desktop applications and developer tools from Debian's archive.
            children:
              - id: onlyoffice
                type: application
                name: OnlyOffice Desktop Editors
                description: Office suite alternative; installed from the upstream arm64 .deb.
                children:
                  - id: onlyoffice-install
                    type: action
                    name: Install
                    action: install
                    command: "wget https://download.onlyoffice.com/install/desktop/editors/linux/onlyoffice-desktopeditors_arm64.deb -O /tmp/office.deb && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y patchelf /tmp/office.deb; patchelf --clear-execstack /opt/onlyoffice/desktopeditors/libQt5Gui.so.5; rm -f /tmp/office.deb"
                  - id: onlyoffice-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y onlyoffice-desktopeditors"
              - id: libreoffice
                type: application
                name: LibreOffice
                description: The full LibreOffice suite from Debian's archive (large download).
                children:
                  - id: libreoffice-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libreoffice"
                  - id: libreoffice-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y libreoffice*"
              - id: gimp
                type: application
                name: GIMP
                description: GNU Image Manipulation Program.
                children:
                  - id: gimp-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gimp"
                  - id: gimp-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y gimp"
              - id: krita
                type: application
                name: Krita
                description: Digital painting application (disable GPU acceleration for smoother operation under proot).
                children:
                  - id: krita-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y krita krita-l10n"
                  - id: krita-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y krita krita-l10n"
              - id: octave
                type: application
                name: Octave
                description: Scientific computing environment, a Matlab alternative to a useful extent.
                children:
                  - id: octave-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y octave"
                  - id: octave-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y octave"
              - id: kdenlive
                type: application
                name: Kdenlive
                description: KDE's non-linear video editor.
                children:
                  - id: kdenlive-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y kdenlive"
                  - id: kdenlive-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y kdenlive"
              - id: visual-studio-code
                type: application
                name: Visual Studio Code
                description: Installed from Microsoft's arm64 .deb; adds a "Code (no sandbox)" launcher because Electron's sandbox needs user namespaces Android withholds under proot.
                children:
                  - id: vscode-install
                    type: action
                    name: Install
                    action: install
                    command: "wget -O /tmp/vscode.deb 'https://aka.ms/linux-arm64-deb' && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/vscode.deb && cp /usr/share/applications/code.desktop /usr/share/applications/code-no-sandbox.desktop && sed -i 's/^Name=.*/Name=Code (no sandbox)/' /usr/share/applications/code-no-sandbox.desktop && sed -i 's#Exec=/usr/share/code/code %F#Exec=/usr/share/code/code --no-sandbox %F#g' /usr/share/applications/code-no-sandbox.desktop; rm -f /tmp/vscode.deb"
                  - id: vscode-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y code && rm -f /usr/share/applications/code-no-sandbox.desktop"
              - id: vlc
                type: application
                name: VLC media player
                description: Multimedia player from Debian's archive.
                children:
                  - id: vlc-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y vlc"
                  - id: vlc-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y vlc"
              - id: thunderbird
                type: application
                name: Thunderbird
                description: Mail and calendar client from Debian's archive.
                children:
                  - id: thunderbird-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y thunderbird"
                  - id: thunderbird-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y thunderbird"

          - id: browsers
            type: category
            name: Browsers
            description: Web browsers packaged for Debian.
            children:
              - id: chromium-browser
                type: application
                name: Chromium Browser
                description: Open-source browser. Installs a "Chromium (no sandbox)" launcher because Chromium's process sandbox needs user namespaces that Android kernels withhold under proot.
                children:
                  - id: chromium-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "chromium --no-sandbox"
                  - id: chromium-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y chromium chromium-l10n && cp /usr/share/applications/chromium.desktop /usr/share/applications/chromium-no-sandbox.desktop && sed -i '/^Name\\[.*\\]=.*/d; s/^Name=.*/Name=Chromium (no sandbox)/' /usr/share/applications/chromium-no-sandbox.desktop && sed -i 's#Exec=/usr/bin/chromium %U#Exec=/usr/bin/chromium --no-sandbox %U#g' /usr/share/applications/chromium-no-sandbox.desktop"
                  - id: chromium-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y chromium chromium-l10n && rm -f /usr/share/applications/chromium-no-sandbox.desktop"
              - id: firefox-esr
                type: application
                name: Firefox ESR
                description: The Extended Support Release of Firefox, shipped in Debian's own archive.
                children:
                  - id: firefox-esr-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "firefox-esr"
                  - id: firefox-esr-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y firefox-esr"
                  - id: firefox-esr-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y firefox-esr"

          - id: development
            type: category
            name: Development
            description: Compilers, build systems and language toolchains from Debian's archive.
            children:
              - id: jetbrains
                type: group
                name: JetBrains IDEs
                description: Installed from JetBrains' own arm64 builds (not in Debian's archive).
                children:
                  - id: pycharm
                    type: application
                    name: PyCharm Community
                    description: Python IDE, installed from JetBrains' pinned arm64 build into /opt.
                    children:
                      - id: pycharm-install
                        type: action
                        name: Install
                        action: install
                        command: "wget -O /tmp/pycharm.tar.gz https://download.jetbrains.com/python/pycharm-community-2024.2.1-aarch64.tar.gz && tar -xzf /tmp/pycharm.tar.gz -C /opt && rm -f /tmp/pycharm.tar.gz && printf '[Desktop Entry]\\nType=Application\\nName=PyCharm Community\\nExec=/opt/pycharm-community-2024.2.1/bin/pycharm.sh\\nIcon=/opt/pycharm-community-2024.2.1/bin/pycharm.png\\nCategories=Development;\\n' > /usr/share/applications/pycharm-community.desktop"
                      - id: pycharm-remove
                        type: action
                        name: Uninstall
                        action: remove
                        command: "rm -rf /opt/pycharm-community-2024.2.1 /usr/share/applications/pycharm-community.desktop"
              - id: build-essential
                type: application
                name: GCC & build tools
                description: gcc, g++, make, libc headers and pkg-config.
                children:
                  - id: build-essential-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config && gcc --version | head -1"
                  - id: build-essential-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y build-essential pkg-config"
              - id: cmake
                type: application
                name: CMake
                children:
                  - id: cmake-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y cmake && cmake --version | head -1"
                  - id: cmake-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y cmake"
              - id: python3
                type: application
                name: Python 3 + venv
                description: Python with pip and a ready-made virtual environment (PEP 668 blocks system-wide pip installs on modern Debian).
                children:
                  - id: python3-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "python3"
                  - id: python3-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-venv && mkdir -p ~/venvs && python3 -m venv ~/venvs/default && ~/venvs/default/bin/pip install --upgrade pip && ~/venvs/default/bin/python --version && echo \"Activate with: source ~/venvs/default/bin/activate\""
                  - id: python3-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y python3 python3-pip python3-venv"
              - id: nodejs
                type: application
                name: Node.js & npm
                description: Node.js from Debian's archive (the version Debian ships — use nvm for newer).
                children:
                  - id: nodejs-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "node"
                  - id: nodejs-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm && node --version"
                  - id: nodejs-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y nodejs npm"
              - id: openjdk
                type: application
                name: Java (OpenJDK)
                description: Debian's default JDK, headless.
                children:
                  - id: openjdk-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "java -version && jshell || java"
                  - id: openjdk-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y default-jdk-headless && java --version"
                  - id: openjdk-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y default-jdk-headless"
              - id: golang
                type: application
                name: Go
                children:
                  - id: golang-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "go version && go"
                  - id: golang-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y golang && go version"
                  - id: golang-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y golang"
              - id: rust
                type: application
                name: Rust
                description: rustc and cargo from Debian's archive.
                children:
                  - id: rust-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "rustc --version && cargo"
                  - id: rust-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y rustc cargo && rustc --version"
                  - id: rust-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y rustc cargo"
              - id: git
                type: application
                name: Git
                children:
                  - id: git-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "git"
                  - id: git-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git && git --version"
                  - id: git-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y git"
              - id: claude-code
                type: application
                name: Claude Code
                description: Anthropic's Claude Code CLI agent, installed globally through npm.
                children:
                  - id: claude-code-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "claude"
                  - id: claude-code-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm && npm install -g @anthropic-ai/claude-code && claude --version"
                  - id: claude-code-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "npm uninstall -g @anthropic-ai/claude-code"

          - id: windows-software
            type: category
            name: Windows Software
            description: Run Windows software through Wine's Windows compatibility layer.
            children:
              - id: wine
                type: application
                name: Wine (Windows compatibility)
                description: Wine from Debian's archive; 64-bit Windows apps where the guest architecture supports them.
                children:
                  - id: wine-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y wine && wine --version"
                  - id: wine-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y wine"
                  - id: wine-wipe-data
                    type: action
                    name: Wipe Wine data
                    description: Deletes the Wine prefix in the home directory — installed Windows programs and their settings go with it.
                    action: remove
                    command: "rm -rf ~/.wine"

          - id: networking
            type: category
            name: Networking
            description: Diagnostics and transfer tools.
            children:
              - id: net-tools
                type: application
                name: Network diagnostics
                description: ping, dig, traceroute, mtr and classic net-tools.
                children:
                  - id: net-tools-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iputils-ping dnsutils net-tools traceroute mtr-tiny"
                  - id: net-tools-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y iputils-ping dnsutils net-tools traceroute mtr-tiny"
              - id: curl-wget
                type: application
                name: curl & wget
                description: Command-line HTTP clients.
                children:
                  - id: curl-wget-launch
                    type: action
                    name: Launch
                    action: launch
                    icon: terminal
                    command: "curl --version | head -1 && wget"
                  - id: curl-wget-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl wget && curl --version | head -1"
                  - id: curl-wget-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y curl wget"
              - id: openssh-client
                type: application
                name: SSH client
                children:
                  - id: openssh-client-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-client && ssh -V 2>&1"
                  - id: openssh-client-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y openssh-client"
              - id: network-info
                type: action
                name: Network info
                action: check
                description: The workspace's addresses and DNS configuration.
                command: "hostname -I; echo; cat /etc/resolv.conf"

          - id: shell-utilities
            type: category
            name: Shell & Utilities
            description: Editors, monitors and everyday command-line helpers.
            children:
              - id: core-tools
                type: application
                name: Core command-line tools
