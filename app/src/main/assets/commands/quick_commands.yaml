                  - id: rust-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y rustc cargo"
              - id: git
                type: application
                name: Git
                children:
                  - id: git-install
                    type: action
                    name: Install
                    action: install
                    command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git && git --version"
                  - id: git-remove
                    type: action
                    name: Uninstall
                    action: remove
                    command: "apt-get autoremove --purge -y git"

          - id: networking
            type: category
            name: Networking
            description: Diagnostics and transfer tools.
            children:
              - id: net-tools
                type: application
