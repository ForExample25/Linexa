      # Ubuntu 24.04 (noble) enforces PEP 668: system-wide pip is refused, so
      # the Python entry switches to the venv-first layout.
      versions:
        "24.04":
          patches:
            - id: python3
              description: Python 3 with a ready-made virtual environment (24.04 enforces PEP 668 and blocks system-wide pip).
            - id: python3-install
              command: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-venv && mkdir -p ~/venvs && python3 -m venv ~/venvs/default && ~/venvs/default/bin/pip install --upgrade pip && echo \"Activate with: source ~/venvs/default/bin/activate\""

